name: claude

on:
  workflow_call:
    inputs:
      trigger_phrase:
        type: string
        required: true
      prompt:
        type: string
        required: false
      reaction:
        type: string
        required: false
      version:
        type: string
        required: false
      timeout:
        type: number
        required: false
    secrets:
      LITELLM_KEY:
        required: true

permissions:
  contents: write
  pull-requests: write
  issues: write
  actions: write

jobs:
  claude:
    runs-on: garm-dev-dlas1-vm-linux-mega-large
    timeout-minutes: ${{ inputs.timeout || 30 }}
    steps:
      - name: React
        if: inputs.reaction && (github.event.comment.id || github.event.issue.number)
        run: gh api repos/${{ github.repository }}/${{ github.event.comment.id && format('issues/comments/{0}', github.event.comment.id) || format('issues/{0}', github.event.issue.number) }}/reactions -f content=${{ inputs.reaction }}
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Registry
        run: |
          npm config set registry https://ukgartifactory.pe.jfrog.io/artifactory/api/npm/npm/
          ACTION_DIR=/home/runner/actions-runner/_work/_actions/anthropics/claude-code-action/v1
          echo '[install]' >> $ACTION_DIR/bunfig.toml
          echo 'registry = "https://ukgartifactory.pe.jfrog.io/artifactory/api/npm/npm/"' >> $ACTION_DIR/bunfig.toml
          rm -f $ACTION_DIR/bun.lockb
          cat $ACTION_DIR/bunfig.toml
          ls -la $ACTION_DIR/bun.lockb 2>&1 || true

      - name: Run
        uses: UKGEPIC/actions/claude-code@main
        with:
          anthropic_api_key: ${{ secrets.LITELLM_KEY }}
          github_token: ${{ github.token }}
          trigger_phrase: ${{ inputs.trigger_phrase }}
          prompt: ${{ inputs.prompt || '' }}
          claude_code_version: ${{ inputs.version || '2.1.87' }}
          settings: settings.json
          claude_args: --dangerously-skip-permissions
