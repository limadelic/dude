name: claude

on:
  workflow_call:
    inputs:
      trigger_phrase:
        type: string
        required: true
      prompt:
        type: string
        required: false
      reaction:
        type: string
        required: false
      version:
        type: string
        required: false
      timeout:
        type: number
        required: false
    secrets:
      LITELLM_KEY:
        required: true

permissions:
  contents: write
  pull-requests: write
  issues: write
  actions: write

jobs:
  claude:
    runs-on: garm-dev-dlas1-vm-linux-mega-large
    timeout-minutes: ${{ inputs.timeout || 30 }}
    steps:
      - name: React
        if: inputs.reaction && (github.event.comment.id || github.event.issue.number)
        run: gh api repos/${{ github.repository }}/${{ github.event.comment.id && format('issues/comments/{0}', github.event.comment.id) || format('issues/{0}', github.event.issue.number) }}/reactions -f content=${{ inputs.reaction }}
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Checkout
        uses: actions/checkout@v4

      - name: Registry
        run: npm config set registry https://ukgartifactory.pe.jfrog.io/artifactory/api/npm/npm/

      - name: Install
        run: |
          sudo rm -f /usr/local/bin/claude
          npm install -g @anthropic-ai/claude-code@${{ inputs.version || '2.1.87' }}
          echo "CLAUDE_PATH=$(which claude)" >> $GITHUB_ENV

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          no-cache: true

      - name: Deps
        run: |
          ACTION_DIR=/home/runner/actions-runner/_work/_actions/anthropics/claude-code-action/v1
          cd $ACTION_DIR && npm install --legacy-peer-deps --registry=https://ukgartifactory.pe.jfrog.io/artifactory/api/npm/npm/
          BUN_REAL=$(which bun)
          WRAPPER_DIR=/home/runner/bun-skip
          mkdir -p $WRAPPER_DIR
          printf '#!/bin/bash\nif [[ "$1" == "install" ]]; then exit 0; fi\nexec %s "$@"\n' "$BUN_REAL" > $WRAPPER_DIR/bun
          chmod +x $WRAPPER_DIR/bun

      - name: Run
        id: claude
        uses: anthropics/claude-code-action@v1
        env:
          ANTHROPIC_BASE_URL: https://sdlc-llm.ukg.int
          CLAUDE_CODE_MODEL: claude-sonnet-4-6
        with:
          path_to_claude_code_executable: ${{ env.CLAUDE_PATH }}
          path_to_bun_executable: /home/runner/bun-skip/bun
          anthropic_api_key: ${{ secrets.LITELLM_KEY }}
          github_token: ${{ github.token }}
          trigger_phrase: ${{ inputs.trigger_phrase }}
          prompt: ${{ inputs.prompt || '' }}
          settings: settings.json
          show_full_output: true
          claude_args: --dangerously-skip-permissions
