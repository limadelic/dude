name: dude

on:
  workflow_call:
    inputs:
      prompt:
        type: string
        required: false
      version:
        type: string
        required: false
      timeout:
        type: number
        required: false
      cwd:
        type: string
        required: false
    secrets:
      LITELLM_KEY:
        required: true

permissions:
  contents: write
  pull-requests: write
  issues: write
  actions: write

jobs:
  dude:
    runs-on: garm-dev-dlas1-vm-linux-mega-large
    timeout-minutes: ${{ inputs.timeout || 30 }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Registry
        run: npm config set registry https://ukgartifactory.pe.jfrog.io/artifactory/api/npm/npm/

      - name: Install
        run: |
          sudo rm -f /usr/local/bin/claude
          npm install -g @anthropic-ai/claude-code@${{ inputs.version || '2.1.87' }}

      - name: Run
        working-directory: ${{ inputs.cwd || '.' }}
        run: |
          claude --print --dangerously-skip-permissions "${{ inputs.prompt }}"
        env:
          ANTHROPIC_BASE_URL: https://sdlc-llm.ukg.int
          ANTHROPIC_API_KEY: ${{ secrets.LITELLM_KEY }}
          CLAUDE_CODE_MODEL: claude-sonnet-4-6
          GH_TOKEN: ${{ github.token }}
          GITHUB_TOKEN: ${{ github.token }}
