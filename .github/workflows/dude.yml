name: dude

on:
  workflow_dispatch:
    inputs:
      prompt:
        type: string
        required: true
      version:
        type: string
        required: false
      cwd:
        type: string
        required: false
      timeout:
        type: number
        required: false
      claude_args:
        type: string
        required: false
  workflow_call:
    inputs:
      prompt:
        type: string
        required: true
      version:
        type: string
        required: false
      cwd:
        type: string
        required: false
      timeout:
        type: number
        required: false
      claude_args:
        type: string
        required: false
    secrets:
      LITELLM_KEY:
        required: true

permissions:
  contents: write
  pull-requests: write
  issues: write
  actions: write

jobs:
  dude:
    runs-on: garm-dev-dlas1-vm-linux-mega-large
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
      ANTHROPIC_BASE_URL: https://sdlc-llm.ukg.int
      ANTHROPIC_AUTH_TOKEN: ${{ secrets.LITELLM_KEY }}
      ANTHROPIC_MODEL: opus
      ANTHROPIC_DEFAULT_HAIKU_MODEL: claude-haiku-4-5
      ANTHROPIC_DEFAULT_OPUS_MODEL: claude-opus-4-6
      ANTHROPIC_DEFAULT_SONNET_MODEL: claude-sonnet-4-6
      CLAUDE_CODE_SUBAGENT_MODEL: haiku
      CLAUDE_CODE_DISABLE_NONESSENTIAL_TRAFFIC: '0'
      CLAUDE_CODE_ENABLE_TELEMETRY: '1'
      CLAUDE_CODE_USE_VERTEX: '0'
      CLAUDE_CODE_EXPERIMENTAL_AGENT_TEAMS: '1'
      NODE_EXTRA_CA_CERTS: ${{ github.workspace }}/ukg.pem
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Registry
        run: npm config set registry https://ukgartifactory.pe.jfrog.io/artifactory/api/npm/npm/

      - name: Install
        run: |
          sudo rm -f /usr/local/bin/claude
          npm install -g @anthropic-ai/claude-code@${{ inputs.version || 'latest' }} 2>/dev/null

      - name: CI mode
        run: |
          DIR=${{ inputs.cwd && format('{0}/{1}', github.workspace, inputs.cwd) || github.workspace }}
          if [ -f "$DIR/.claude/CLAUDE.ci.md" ]; then
            cp "$DIR/.claude/CLAUDE.ci.md" "$DIR/.claude/CLAUDE.md"
          elif [ -f "$DIR/CLAUDE.ci.md" ]; then
            cp "$DIR/CLAUDE.ci.md" "$DIR/CLAUDE.md"
          fi

      - name: Run
        working-directory: ${{ inputs.cwd && format('{0}/{1}', github.workspace, inputs.cwd) || github.workspace }}
        run: |
          claude -p --dangerously-skip-permissions "${{ inputs.prompt }}" ${{ inputs.claude_args }} > /tmp/claude-output.txt 2>/dev/null
          echo "## Output" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          cat /tmp/claude-output.txt >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
